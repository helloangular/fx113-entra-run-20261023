name: qa-owned-rem21-entra
run-name: "${{ inputs.helio_execution_id }}"
on:
  workflow_dispatch:
    inputs:
      environment:
        type: string
        default: qa-owned-rem21-entra-production
      helio_execution_id:
        type: string
        default: ''
      helio_release_id:
        type: string
        default: ''
      helio_stage_id:
        type: string
        default: ''
      workflow_revision:
        type: string
        default: ''
      release_version:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: qa-owned-rem21-entra-production
    steps:
      - run: echo 'Owned Entra-run fixture only; no deployment'
